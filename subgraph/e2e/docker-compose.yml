# Graph Node, IPFS and Postgres for indexing a local Anvil chain, named `anvil` as networks.json
# expects. Anvil must listen on all interfaces (anvil --host 0.0.0.0) for the container to reach it
# through host.docker.internal.
services:
  graph-node:
    image: graphprotocol/graph-node:v0.45.0
    ports:
      - "8000:8000" # GraphQL queries
      - "8020:8020" # admin JSON-RPC (graph create / deploy)
      - "8030:8030" # indexing status
      - "8040:8040" # metrics
    depends_on:
      - ipfs
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      ethereum: "anvil:http://host.docker.internal:8545"
      GRAPH_LOG: info
      ETHEREUM_POLLING_INTERVAL: "500"
  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - "5001:5001"
  postgres:
    image: postgres:14
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements", "-cmax_connections=200"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
